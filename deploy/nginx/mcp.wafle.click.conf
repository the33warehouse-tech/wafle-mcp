# nginx vhost for mcp.wafle.click → wafle-mcp on :7100.
# Place at /etc/nginx/sites-available/mcp.wafle.click.conf, symlink to sites-enabled.
# TLS via Let's Encrypt (`certbot --nginx -d mcp.wafle.click`).

server {
    listen 80;
    listen [::]:80;
    server_name mcp.wafle.click;

    # Let's Encrypt http-01 challenge (only).
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.wafle.click;

    ssl_certificate /etc/letsencrypt/live/mcp.wafle.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.wafle.click/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Streamable HTTP needs SSE-friendly buffering off and longer timeouts.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    chunked_transfer_encoding on;

    # Big enough for tool outputs.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:7100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Pass through MCP session header both ways.
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_pass_header Mcp-Session-Id;
    }
}
